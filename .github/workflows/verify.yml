name: verify

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      # --frozen-lockfile is the gate, not a convenience. A lockfile that does
      # not match the manifests dirties every contributor's first install, and
      # this repository has shipped that defect twice.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Format
        run: pnpm run format:check

      - name: Evidence graph
        run: pnpm run evidence

      # A build that leaves the tree dirty means an artifact is tracked that
      # should not be, or a generated file was committed stale.
      - name: Working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The tree is dirty after install, build, and checks:"
            git status --porcelain
            git diff
            exit 1
          fi
