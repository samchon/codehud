name: build
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

# A pull-request push replaces its predecessor rather than queueing behind it.
# A master push never cancels: the post-merge run on an exact merge commit is
# the record that the merge itself is green, and a cancelled run records nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # The range is the one the event owns. A mutable branch name or a locally
      # inferred merge base would check a different diff than the one that is
      # about to merge.
      - name: Validate incoming diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            git diff --check "$PUSH_BASE_SHA...$PUSH_HEAD_SHA"
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      # --frozen-lockfile is the gate, not a convenience. A lockfile that does
      # not match the manifests dirties every contributor's first install, and
      # this repository has shipped that defect twice.
      - run: pnpm install --frozen-lockfile

      # After the install, because the path lives under node_modules and an
      # install would write over a restored cache.
      #
      # This is where the run's time went. Measured on run 35210914958, the
      # build took 108 seconds of a 131 second job, almost all of it ttsc
      # compiling the @ttsc/lint Go plugin cold. Warm, the same build is 17.
      # The sibling go-build directory is 1.6 GB and is only needed to build
      # the plugin, so it stays out.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ttsc-plugins-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm run build

      # A dirty tree afterwards means a build wrote somewhere it should not, or
      # a generated file was committed stale. Untracked files count: one that
      # nothing ignores is the same defect wearing a different hat, and
      # `git diff` alone does not see it.
      - name: Verify the build left the checkout clean
        run: |
          git diff --check HEAD --
          git diff --exit-code HEAD --
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf '%s\n' "$untracked"
            exit 1
          fi
