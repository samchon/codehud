name: test
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

# A pull-request push replaces its predecessor rather than queueing behind it.
# A master push never cancels: the post-merge run on an exact merge commit is
# the record that the merge itself is green, and a cancelled run records nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # The range is the one the event owns. A mutable branch name or a locally
      # inferred merge base would check a different diff than the one that is
      # about to merge.
      - name: Validate incoming diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            git diff --check "$PUSH_BASE_SHA...$PUSH_HEAD_SHA"
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      # --frozen-lockfile is the gate, not a convenience. A lockfile that does
      # not match the manifests dirties every contributor's first install, and
      # this repository has shipped that defect twice.
      - run: pnpm install --frozen-lockfile

      # After the install, because the path lives under node_modules and an
      # install would write over a restored cache.
      #
      # The suite deliberately does not build the packages first. `ttsx`
      # resolves each workspace dependency to its own source and transpiles on
      # the way through, so a built `lib/` would be a second copy of what the
      # suite already reads. The cache is still wanted here because the suite's
      # own type-check loads the same plugin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ttsc-plugins-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          # A changed lockfile is not a changed plugin. The key has to include
          # the lockfile so a ttsc or @ttsc/lint bump gets a fresh entry, but
          # adding an unrelated dependency changes it too, and without a
          # fallback every such pull request recompiles the Go plugin from
          # cold: measured at 2m28s against 35s warm.
          #
          # Restoring an entry built from a different lockfile is safe because
          # the cache is content-addressed. Each plugin lives under a hash of
          # its own identity, holding `plugin.exe` and a `.last-used` stamp,
          # with a `.gc-last-run` beside them. ttsc looks up by that hash: an
          # unchanged plugin hits, a changed one compiles a new entry, and the
          # stale one is collected rather than mistaken for current.
          restore-keys: |
            ttsc-plugins-${{ runner.os }}-

      - run: pnpm run test

      # A dirty tree afterwards means a build wrote somewhere it should not, or
      # a generated file was committed stale. Untracked files count: one that
      # nothing ignores is the same defect wearing a different hat, and
      # `git diff` alone does not see it.
      - name: Verify the suite left the checkout clean
        run: |
          git diff --check HEAD --
          git diff --exit-code HEAD --
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf '%s\n' "$untracked"
            exit 1
          fi
